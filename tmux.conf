set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -g status-position top
set -gs escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 50000
set -g display-time 5000
set -g status-interval 5
setw -g aggressive-resize on
set -g mouse on
setw -g monitor-activity on
set -g visual-activity on

# Sets up some vi uses in tmux
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi "v" send -X begin-selection
bind-key -T copy-mode-vi "y" send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Adjust leader from ctrl-b to ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

set -g detach-on-destroy off  # don't exit tmux when closing a session

bind-key x kill-pane

# Better pane splitting
unbind %
bind "\\" split-window -h
unbind "\'"
bind - split-window -v

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

# Plugins
set -g @plugin "b0o/tmux-autoreload"
set -g @plugin "catppuccin/tmux"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "jaclu/tmux-power-zoom"
set -g @plugin "MaximilianGaedig/tmux-filter"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tpm"

# Plugins Config
set -g @catppuccin_flavour "mocha"
set -g @catppuccin_window_status_enable "yes"
set -g @catppuccin_window_status_icon_enable "yes"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_status_modules_right "directory session simple_git_status date_time"
set -g @catppuccin_date_time_text "%-I:%M %p %b %-d"
set -g @catppuccin_window_default_text "#{b:window_name}"
set -g @catppuccin_window_current_text "#{b:window_name}"
set -g @catppuccin_icon_window_current " "
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator ""

set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-processes ':all:'
set -g @resurrect-hook-post-save-all 'eval $(xdotool getwindowgeometry --shell $WINDOWID); echo 0,$X,$Y,$WIDTH,$HEIGHT > $HOME/.tmux/resurrect/geometry'
set -g @resurrect-hook-pre-restore-all 'wmctrl -i -r $WINDOWID -e $(cat $HOME/.tmux/resurrect/geometry)'
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"

set -g @continuum-boot "on"
set -g @continuum-boot-options "wezterm"
set -g @continuum-restore "on"

# Sesh - session manager (fzf)
bind-key "s" display-popup -E -w 55% -h 60% "sesh connect \"$(
  sesh list | fzf \
    --no-sort --border-label ' sesh ' --prompt '⚡ ' \
    --header '^a all ^t tmux ^x zoxide ^g config ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t)' \
    --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z)' \
    --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡ )+reload(sesh list)'
)\""

# Sesh - session manager (gum)
bind-key "S" display-popup -E -w 40% "sesh connect \"$(
  sesh list | gum filter --limit 1 --fuzzy --no-sort \
    --placeholder 'Pick a sesh' --prompt='⚡ '
)\""

# Sesh - last session toggle
bind -N "last-session (via sesh)" L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"

run "$HOME/.config/tmux/plugins/tpm/tpm"
